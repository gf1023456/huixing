<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>户型装修设计</title>
  <style>
    :root {
      --bg: #f3efe7;
      --panel: #fffdf9;
      --panel-2: #f7f3ee;
      --line: #e5dccb;
      --ink: #2b2824;
      --muted: #8a8174;
      --accent: #b76743;
      --accent-soft: #f4e4d9;
      --teal: #346365;
      --danger: #b53a2d;
      --shadow: rgba(34, 27, 20, 0.14);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; overflow: hidden; }
    body { display: grid; grid-template-rows: 52px minmax(0,1fr) 32px; }
    button, input, select { font: inherit; color: inherit; }
    .hidden { display: none !important; }

    header {
      display: flex; align-items: center; gap: 10px; padding: 8px 14px;
      background: var(--panel); border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex; flex-direction: column; justify-content: center; line-height: 1.15; min-width: 140px;
    }
    .brand strong { font-size: 15px; letter-spacing: .3px; }
    .brand span { font-size: 11px; color: var(--muted); }
    .seg { display: flex; gap: 0; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
    .seg .btn { width: 82px; }
    .btn {
      appearance: none; border: 1px solid transparent; background: transparent; color: var(--ink);
      padding: 6px 10px; border-radius: 7px; cursor: pointer; white-space: nowrap; transition: .15s ease;
    }
    .btn:hover { background: #f2ece4; }
    .btn.on { background: var(--ink); color: white; }
    .primary { background: var(--accent); color: white; }
    .primary:hover { filter: brightness(0.98); }
    .toolbar { display: flex; align-items: center; gap: 6px; }
    .spacer { flex: 1; }

    .app {
      display: grid; grid-template-columns: 240px minmax(0,1fr) 300px; height: 100%;
    }

    aside {
      background: var(--panel); border-right: 1px solid var(--line);
      overflow: auto;
    }
    aside.right { border-right: none; border-left: 1px solid var(--line); }

    .library { padding-bottom: 12px; }
    .library h4 {
      margin: 0; padding: 12px 14px 8px; font-size: 12px; letter-spacing: 1px; color: var(--muted);
      position: sticky; top: 0; background: var(--panel); z-index: 2;
    }
    .library-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 10px;
    }
    .item {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      padding: 8px 4px 6px; border: 1px solid var(--line); border-radius: 9px; background: white; cursor: grab; user-select: none;
      box-shadow: 0 2px 0 rgba(0,0,0,.015);
    }
    .item:active { cursor: grabbing; }
    .item svg { width: 62px; height: 42px; display: block; }
    .item b { font-size: 12px; font-weight: 600; }
    .item small { font-size: 11px; color: var(--muted); }
    .hint { margin-top: 10px; padding: 0 12px; font-size: 12px; color: var(--muted); }

    main {
      position: relative; background: var(--panel-2); overflow: hidden; border-left: 1px solid var(--line);
    }
    #canvas {
      width: 100%; height: 100%; display: block; background: linear-gradient(#f9f5f0, #efe6da);
      touch-action: none;
    }
    #canvas.measure { cursor: crosshair; }
    #canvas.demolish { cursor: pointer; }
    #canvas.select { cursor: default; }
    .ghost {
      position: absolute; inset: 0; display: none; pointer-events: none; z-index: 2;
    }
    .ghost.show { display: block; }
    .hud {
      position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
      background: rgba(43,40,36,.9); color: white; padding: 7px 12px; border-radius: 999px;
      font-size: 12px; letter-spacing: .2px; opacity: 0; transition: .2s ease; z-index: 5;
    }
    .hud.show { opacity: .9; }
    .fiv { position: absolute; left: 12px; bottom: 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.9); font-size: 12px; pointer-events: none; }
    .fiv .bar { height: 7px; border: 2px solid var(--ink); border-top: 0; margin-top: 3px; }
    #measureText {
      position: absolute; right: 10px; bottom: 10px; max-width: 220px; background: rgba(255,255,255,.9); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; color: var(--muted); pointer-events: none; z-index: 4;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #fab {
      position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 12px); display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.97); border: 1px solid var(--line); border-radius: 14px; padding: 5px; box-shadow: 0 8px 28px var(--shadow); opacity: 0; visibility: hidden; transition: .2s ease; z-index: 8;
    }
    #fab.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
    #fab .name { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 8px; font-weight: 600; }

    .panel-section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .panel-section h3 { margin: 0 0 8px; font-size: 13px; }
    .panel-section h3 small { color: var(--muted); font-weight: 500; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .kpi {
      background: #faf6ef; border-radius: 10px; padding: 8px; border: 1px solid #efe8dd;
    }
    .kpi small { display: block; color: var(--muted); font-size: 11px; }
    .kpi b { display: block; margin-top: 5px; font-size: 22px; font-variant-numeric: tabular-nums; }
    .room-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .room-pill {
      width: 100%; border: 1px solid var(--line); background: white; border-radius: 8px; padding: 7px 8px; text-align: left; cursor: pointer;
      line-height: 1.25;
    }
    .room-pill.on { background: var(--accent-soft); border-color: #e8c8af; color: var(--accent); }
    .room-pill small { display: block; color: var(--muted); font-variant-numeric: tabular-nums; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
    label.full { grid-column: 1 / -1; }
    input, select { border: 1px solid var(--line); background: white; border-radius: 6px; padding: 6px 8px; width: 100%; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .thin-list { list-style: none; padding: 0; margin: 0; }
    .thin-list li { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed #e9e1d5; }
    .material-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .mat-item {
      display: flex; align-items: center; gap: 8px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: white; cursor: pointer; text-align: left;
    }
    .mat-item.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-soft); background: var(--accent-soft); }
    .mat-swatch { width: 26px; height: 26px; border: 1px solid rgba(0,0,0,.15); border-radius: 6px; flex: none; }
    .mat-text { font-size: 12px; }
    .mat-text small { display: block; color: var(--muted); }

    footer {
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      background: var(--panel); border-top: 1px solid var(--line); padding: 0 16px; color: var(--muted); font-size: 12px;
    }
    footer b { color: var(--ink); }

    #toast {
      position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%) translateY(20px); opacity: 0; transition: .2s ease; background: rgba(30, 28, 25, 0.96); color: white; padding: 8px 14px; border-radius: 10px; z-index: 30; pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #threeWrap {
      position: absolute; inset: 0; display: none; background: radial-gradient(circle at center, #f6f1ea 0%, #e8dfd0 100%);
    }
    body.view-3d #threeWrap { display: block; }
    body.view-3d #canvas { display: none; }
    #threeWrap canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <strong>户型装修设计</strong>
      <span>纯前端方案工具</span>
    </div>

    <div class="seg" aria-label="语言切换">
      <button class="btn on" data-lang="zh">中文</button>
      <button class="btn" data-lang="en">English</button>
    </div>

    <div class="spacer"></div>

    <div class="seg" aria-label="视图切换">
      <button class="btn on" data-view="2d">2D</button>
      <button class="btn" data-view="3d">3D</button>
    </div>

    <div class="toolbar">
      <button class="btn" data-tool="select">选择</button>
      <button class="btn" data-tool="measure">测量</button>
      <button class="btn" data-tool="demolish">拆改</button>
      <button class="btn primary" id="newPlanBtn">新方案</button>
    </div>
  </header>

  <div class="app">
    <aside class="library">
      <h4>家具库</h4>
      <div class="library-grid" id="libraryGrid"></div>
      <div class="hint">拖进平面图：移动、旋转、尺寸调整，Shift 锁定角度。</div>
    </aside>

    <main>
      <svg id="canvas" class="select" viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="threeWrap"></div>

      <div id="hud" class="hud">选择模式</div>
      <div class="fiv"><div>1000mm</div><div class="bar"></div></div>
      <div id="measureText">未测量</div>

      <div id="fab">
        <span class="name" id="fabName">家具</span>
        <button class="btn" id="rotateBtn">旋转</button>
        <button class="btn" id="copyBtn">复制</button>
        <button class="btn" id="deleteBtn">删除</button>
      </div>
    </main>

    <aside class="right">
      <div class="panel-section">
        <h3>房间 <small>列表</small></h3>
        <div id="roomList" class="room-list"></div>
      </div>

      <div class="panel-section">
        <h3>方案 <small>统计</small></h3>
        <div class="stats-grid">
          <div class="kpi"><small>建筑面积</small><b id="areaTotal">0</b></div>
          <div class="kpi"><small>使用面积</small><b id="areaUsed">0</b></div>
          <div class="kpi"><small>家具数</small><b id="furnitureCount">0</b></div>
          <div class="kpi"><small>预算</small><b id="budgetTotal">0</b></div>
        </div>
      </div>

      <div class="panel-section">
        <h3>房间属性</h3>
        <div class="form-grid">
          <label><span>房间名</span><input id="roomNameInput" /></label>
          <label><span>面积</span><input id="roomAreaInput" readonly /></label>
          <label class="full"><span>地面材质</span>
            <div id="materialGrid" class="material-grid"></div>
          </label>
        </div>
        <div class="actions">
          <button class="btn" id="applyRoomBtn">应用</button>
          <button class="btn" id="exportBtn">导出 JSON</button>
          <button class="btn" id="importBtn">导入 JSON</button>
        </div>
      </div>

      <div class="panel-section">
        <h3>快捷键</h3>
        <ul class="thin-list">
          <li><span>V / M / X</span><span>选择 / 测量 / 拆改</span></li>
          <li><span>R / Shift + R</span><span>旋转</span></li>
          <li><span>Delete</span><span>删除</span></li>
          <li><span>Ctrl + D</span><span>复制</span></li>
          <li><span>Ctrl + Z</span><span>撤销</span></li>
        </ul>
      </div>
    </aside>
  </div>

  <footer>
    <span><b>提示：</b> 直接拖入家具到平面图，并使用房间列表控制地面材质和面积统计。</span>
    <span id="saveStatus">方案已保存</span>
  </footer>

  <div id="toast"></div>

  <script>
    const STORAGE_KEY = 'huixing-fp-v2';

    const roomPolygons = {
      '客厅': [[120,120],[710,120],[710,500],[540,500],[540,620],[250,620],[250,590],[120,590]],
      '卧室': [[120,590],[700,590],[700,760],[120,760]],
      '厨房': [[720,120],[960,120],[960,290],[720,290]],
      '书房': [[720,310],[960,310],[960,520],[720,520]],
      '主卧': [[720,530],[960,530],[960,760],[920,760],[920,700],[720,700]],
      '阳台': [[430,620],[720,620],[720,700],[430,700]]
    };

    const defaultMaterials = {
      '客厅': 'wood',
      '卧室': 'tile',
      '厨房': 'stone',
      '书房': 'wood',
      '主卧': 'carpet',
      '阳台': 'mosaic'
    };

    const materials = [
      { id: 'wood', name: '木地板', color: '#d5b78e', price: 220 },
      { id: 'tile', name: '地砖', color: '#b7c7d9', price: 260 },
      { id: 'stone', name: '大理石', color: '#dfe6ec', price: 310 },
      { id: 'mosaic', name: '水磨石', color: '#d7d0be', price: 240 },
      { id: 'carpet', name: '地毯', color: '#d5bcc3', price: 200 }
    ];

    const furnitureTemplates = [
      { id:'bed', name:'双人床', w:185, h:210, color:'#c5a88f' },
      { id:'sofa', name:'沙发', w:220, h:90, color:'#8fa5c5' },
      { id:'table', name:'餐桌', w:140, h:140, color:'#d7c7ad' },
      { id:'desk', name:'书桌', w:155, h:85, color:'#cbb896' },
      { id:'cabinet', name:'衣柜', w:90, h:50, color:'#9aa89e' },
      { id:'tv', name:'电视柜', w:150, h:46, color:'#a4b1ba' },
      { id:'toilet', name:'卫浴', w:82, h:62, color:'#dfe9ea' },
      { id:'stove', name:'灶台', w:110, h:62, color:'#d0c5b0' }
    ];

    const state = {
      tool: 'select',
      view: '2d',
      selectedId: null,
      selectedRoom: '客厅',
      drag: null,
      pendingMeasure: null,
      rooms: Object.entries(roomPolygons).map(([id, polygon]) => ({ id, name:id, polygon, material: defaultMaterials[id] })),
      furniture: [],
      walls: [
        {id:'w1', x1:120, y1:120, x2:710, y2:120},
        {id:'w2', x1:710, y1:120, x2:710, y2:500},{id:'w3', x1:710, y1:500, x2:540, y2:500},
        {id:'w4', x1:540, y1:500, x2:540, y2:620},{id:'w5', x1:540, y1:620, x2:250, y2:620},
        {id:'w6', x1:250, y1:620, x2:250, y2:590},{id:'w7', x1:250, y1:590, x2:120, y2:590},
        {id:'w8', x1:120, y1:590, x2:120, y2:120},
        {id:'w9', x1:720, y1:120, x2:960, y2:120},{id:'w10', x1:960, y1:120, x2:960, y2:290},
        {id:'w11', x1:960, y1:290, x2:720, y2:290},{id:'w12', x1:720, y1:290, x2:720, y2:120},
        {id:'w13', x1:720, y1:310, x2:960, y2:310},{id:'w14', x1:960, y1:310, x2:960, y2:520},
        {id:'w15', x1:960, y1:520, x2:720, y2:520},{id:'w16', x1:720, y1:520, x2:720, y2:310},
        {id:'w17', x1:720, y1:530, x2:960, y2:530},{id:'w18', x1:960, y1:530, x2:960, y2:760},
        {id:'w19', x1:960, y1:760, x2:720, y2:760},{id:'w20', x1:720, y1:760, x2:720, y2:530},
        {id:'w21', x1:430, y1:620, x2:720, y2:620},{id:'w22', x1:720, y1:620, x2:720, y2:700},
        {id:'w23', x1:720, y1:700, x2:430, y2:700},{id:'w24', x1:430, y1:700, x2:430, y2:620}
      ],
      history: []
    };

    const svg = document.getElementById('canvas');
    const roomListEl = document.getElementById('roomList');
    const libraryGrid = document.getElementById('libraryGrid');
    const roomNameInput = document.getElementById('roomNameInput');
    const roomAreaInput = document.getElementById('roomAreaInput');
    const materialGrid = document.getElementById('materialGrid');
    const areaTotal = document.getElementById('areaTotal');
    const areaUsed = document.getElementById('areaUsed');
    const furnitureCount = document.getElementById('furnitureCount');
    const budgetTotal = document.getElementById('budgetTotal');
    const saveStatus = document.getElementById('saveStatus');
    const hud = document.getElementById('hud');
    const measureText = document.getElementById('measureText');
    const fab = document.getElementById('fab');
    const fabName = document.getElementById('fabName');
    const toast = document.getElementById('toast');

    function randomId(prefix = 'id') {
      return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function clamp(value, min, max) { return Math.min(Math.max(value, min), max); }

    function polygonArea(poly) {
      let sum = 0;
      for (let i=0; i<poly.length; i++) {
        const [x1,y1] = poly[i];
        const [x2,y2] = poly[(i+1)%poly.length];
        sum += x1*y2 - x2*y1;
      }
      return Math.abs(sum)/2;
    }

    function savePlan() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ rooms: state.rooms, furniture: state.furniture, walls: state.walls }));
      saveStatus.textContent = '方案已保存';
    }

    function loadPlan() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed.rooms) state.rooms = parsed.rooms;
        if (parsed.furniture) state.furniture = parsed.furniture;
        if (parsed.walls) state.walls = parsed.walls;
      } catch (e) {
        console.warn('Failed to load plan', e);
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.tid);
      showToast.tid = setTimeout(() => toast.classList.remove('show'), 1300);
    }

    function showHud(text) {
      hud.textContent = text;
      hud.classList.add('show');
      clearTimeout(showHud.tid);
      showHud.tid = setTimeout(() => hud.classList.remove('show'), 700);
    }

    function renderLibrary() {
      libraryGrid.innerHTML = furnitureTemplates.map(item => `
        <div class="item" draggable="true" data-template-id="${item.id}" tabindex="0">
          <svg viewBox="0 0 80 60" aria-label="${item.name}">
            <rect x="10" y="15" width="60" height="30" rx="6" fill="${item.color}" stroke="#2b2824" opacity="0.8"></rect>
            <rect x="18" y="10" width="42" height="10" rx="4" fill="rgba(255,255,255,0.25)"></rect>
          </svg>
          <b>${item.name}</b>
          <small>${item.w} × ${item.h}</small>
        </div>
      `).join('');

      libraryGrid.querySelectorAll('.item').forEach((node) => {
        node.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', node.dataset.templateId);
          node.style.opacity = '0.5';
        });
        node.addEventListener('dragend', () => node.style.opacity = '1');
        node.addEventListener('click', () => {
          const template = furnitureTemplates.find(t => t.id === node.dataset.templateId);
          if (!template) return;
          const x = 220 + Math.random() * 150;
          const y = 180 + Math.random() * 120;
          addFurniture(template.id, x, y, 0);
        });
      });
    }

    function roomById(id) {
      return state.rooms.find(r => r.id === id) || state.rooms[0];
    }

    function furnitureById(id) {
      return state.furniture.find(f => f.id === id) || null;
    }

    function renderRoomList() {
      roomListEl.innerHTML = state.rooms.map(room => {
        const area = polygonArea(room.polygon);
        const active = state.selectedRoom === room.id ? 'on' : '';
        return `<button class="room-pill ${active}" data-room-id="${room.id}" type="button">
          <span>${room.name}</span>
          <small>${Math.round(area)} mm²</small>
        </button>`;
      }).join('');

      roomListEl.querySelectorAll('.room-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedRoom = btn.dataset.roomId;
          renderRoomList();
          syncRoomEditor();
        });
      });
    }

    function syncRoomEditor() {
      const room = roomById(state.selectedRoom);
      if (!room) return;
      roomNameInput.value = room.name;
      roomAreaInput.value = `${Math.round(polygonArea(room.polygon))} mm²`;
      const material = materials.find(m => m.id === room.material) || materials[0];
      materialGrid.innerHTML = materials.map(mat => `
        <button class="mat-item ${room.material === mat.id ? 'on' : ''}" type="button" data-mat-id="${mat.id}">
          <span class="mat-swatch" style="background:${mat.color};"></span>
          <span class="mat-text">${mat.name}<small>${mat.price}¥/㎡</small></span>
        </button>
      `).join('');
      materialGrid.querySelectorAll('.mat-item').forEach(btn => {
        btn.addEventListener('click', () => {
          room.material = btn.dataset.matId;
          savePlan();
          syncRoomEditor();
          render();
        });
      });
    }

    function addFurniture(templateId, x, y, angle = 0) {
      const template = furnitureTemplates.find(t => t.id === templateId);
      if (!template) return;
      const furniture = {
        id: randomId('furn'),
        templateId: template.id,
        name: template.name,
        w: template.w,
        h: template.h,
        color: template.color,
        x, y, angle
      };
      state.furniture.push(furniture);
      state.selectedId = furniture.id;
      render();
      savePlan();
    }

    function getFurnitureById(id) {
      return state.furniture.find(f => f.id === id) || null;
    }

    function ptToSvg(evt) {
      const rect = svg.getBoundingClientRect();
      const x = ((evt.clientX - rect.left) / rect.width) * 1000;
      const y = ((evt.clientY - rect.top) / rect.height) * 760;
      return { x, y };
    }

    function pointInFurniture(px, py, furniture) {
      return px >= furniture.x && px <= furniture.x + furniture.w && py >= furniture.y && py <= furniture.y + furniture.h;
    }

    function renderPlan() {
      const roomMarkup = state.rooms.map(room => {
        const points = room.polygon.map(([x,y]) => `${x},${y}`).join(' ');
        const fill = {
          '客厅': '#dfe7ef',
          '卧室': '#d8c8ab',
          '厨房': '#e2e0dd',
          '书房': '#d4c7a7',
          '主卧': '#d5d8c7',
          '阳台': '#dfe5e0'
        }[room.name] || '#e9e0d3';
        return `<polygon points="${points}" fill="${fill}" stroke="#9b6d49" stroke-width="2" stroke-opacity="0.5" />`;
      }).join('');

      const wallMarkup = state.walls.map(w => `
        <line x1="${w.x1}" y1="${w.y1}" x2="${w.x2}" y2="${w.y2}" stroke="#2a2725" stroke-width="5" stroke-linecap="round" opacity="0.9" />
      `).join('');

      const furnitureMarkup = state.furniture.map((f) => {
        const cx = f.x + f.w/2;
        const cy = f.y + f.h/2;
        const selected = state.selectedId === f.id ? 'stroke="#b76743" stroke-width="3"' : 'stroke="rgba(30,30,30,0.25)" stroke-width="1"';
        return `
          <g transform="rotate(${f.angle} ${cx} ${cy})" data-fid="${f.id}">
            <rect x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" rx="8" fill="${f.color}" ${selected} />
            <rect x="${f.x + 10}" y="${f.y + 10}" width="${Math.max(8, f.w - 20)}" height="${Math.max(8, f.h - 20)}" rx="8" fill="rgba(255,255,255,0.18)" />
          </g>
        `;
      }).join('');

      const labelMarkup = state.rooms.map(room => {
        const poly = room.polygon;
        const px = poly.reduce((sum, [x]) => sum + x, 0) / poly.length;
        const py = poly.reduce((sum, [,y]) => sum + y, 0) / poly.length;
        return `<text x="${px}" y="${py}" text-anchor="middle" font-size="18" fill="#2b2824" font-weight="600">${room.name}</text>`;
      }).join('');

      svg.innerHTML = `${roomMarkup}${wallMarkup}${furnitureMarkup}${labelMarkup}`;
      svg.setAttribute('class', state.tool);

      svg.querySelectorAll('g[data-fid]').forEach(group => {
        group.addEventListener('pointerdown', (evt) => {
          const id = group.getAttribute('data-fid');
          const furniture = furnitureById(id);
          if (!furniture) return;
          state.selectedId = id;
          render();

          if (state.tool !== 'select') return;
          const p = ptToSvg(evt);
          state.drag = {
            id: furniture.id,
            startX: furniture.x,
            startY: furniture.y,
            pointerStartX: p.x,
            pointerStartY: p.y,
            moveX: 0,
            moveY: 0
          };
        });
      });

      svg.onpointerdown = (evt) => {
        if (state.tool === 'measure') {
          const p = ptToSvg(evt);
          if (!state.pendingMeasure) {
            state.pendingMeasure = { x:p.x, y:p.y };
            measureText.textContent = `起点: ${Math.round(p.x)}, ${Math.round(p.y)}`;
            showToast('测量起点已记录');
          } else {
            const dx = p.x - state.pendingMeasure.x;
            const dy = p.y - state.pendingMeasure.y;
            const dist = Math.hypot(dx, dy);
            measureText.textContent = `长度: ${Math.round(dist)} mm`;
            showToast(`测量结果：${Math.round(dist)} mm`);
            state.pendingMeasure = null;
          }
          return;
        }

        if (state.tool === 'demolish') {
          const wall = findWallNearClick(evt);
          if (wall) {
            state.walls = state.walls.filter(w => w.id !== wall.id);
            savePlan();
            render();
            showToast('已拆除墙体');
          }
          return;
        }

        if (state.tool === 'select') {
          const p = ptToSvg(evt);
          let hit = null;
          for (let i = state.furniture.length - 1; i >= 0; i--) {
            const f = state.furniture[i];
            if (pointInFurniture(p.x, p.y, f)) { hit = f; break; }
          }
          state.selectedId = hit ? hit.id : null;
          render();
        }
      };

      svg.onpointermove = (evt) => {
        if (!state.drag) return;
        const furniture = furnitureById(state.drag.id);
        if (!furniture) return;
        const p = ptToSvg(evt);
        const dx = p.x - state.drag.pointerStartX;
        const dy = p.y - state.drag.pointerStartY;
        furniture.x = clamp(state.drag.startX + dx, 20, 960 - furniture.w);
        furniture.y = clamp(state.drag.startY + dy, 20, 720 - furniture.h);
        render();
      };

      window.onpointerup = () => {
        if (state.drag) {
          savePlan();
        }
        state.drag = null;
      };

      svg.ondragover = (e) => e.preventDefault();
      svg.ondrop = (e) => {
        e.preventDefault();
        const templateId = e.dataTransfer.getData('text/plain');
        const p = ptToSvg(e);
        addFurniture(templateId, p.x - 60, p.y - 40, 0);
      };
    }

    function findWallNearClick(evt) {
      const p = ptToSvg(evt);
      const tolerance = 12;
      for (const wall of state.walls) {
        const dist = distanceToSegment(p.x, p.y, wall.x1, wall.y1, wall.x2, wall.y2);
        if (dist <= tolerance) return wall;
      }
      return null;
    }

    function distanceToSegment(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      if (dx === 0 && dy === 0) return Math.hypot(px - x1, py - y1);
      const t = clamp(((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy), 0, 1);
      const cx = x1 + t * dx;
      const cy = y1 + t * dy;
      return Math.hypot(px - cx, py - cy);
    }

    function render3D() {
      const wrap = document.getElementById('threeWrap');
      if (!window.THREE) {
        wrap.innerHTML = '<div style="display:grid;place-items:center;height:100%;color:#6c625b;font-size:18px;">3D 场景正在加载中…</div>';
        return;
      }

      const existing = wrap.__sceneRoot;
      if (existing) {
        existing.traverse((obj) => {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
            else obj.material.dispose();
          }
        });
        existing.clear();
      }

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#efe6d8');
      const camera = new THREE.PerspectiveCamera(42, wrap.clientWidth / wrap.clientHeight, 0.1, 3000);
      camera.position.set(500, 540, 780);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(wrap.clientWidth, wrap.clientHeight);
      wrap.innerHTML = '';
      wrap.appendChild(renderer.domElement);
      wrap.__sceneRoot = scene;

      const ambient = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambient);

      const dirLight = new THREE.DirectionalLight(0xfff5d8, 1.1);
      dirLight.position.set(180, 300, 200);
      scene.add(dirLight);

      const floor = new THREE.Mesh(
        new THREE.BoxGeometry(980, 2, 760),
        new THREE.MeshStandardMaterial({ color: '#efe4d3', roughness: 0.9 })
      );
      floor.position.set(480, -2, 380);
      scene.add(floor);

      const groundGrid = new THREE.GridHelper(1200, 25, 0xb4a189, 0xd8cbb5);
      groundGrid.position.y = 1;
      groundGrid.rotation.x = Math.PI/2;
      groundGrid.position.z = 0;
      scene.add(groundGrid);

      state.rooms.forEach(room => {
        const poly = room.polygon;
        const xVals = poly.map(p => p[0]);
        const yVals = poly.map(p => p[1]);
        const minX = Math.min(...xVals);
        const maxX = Math.max(...xVals);
        const minY = Math.min(...yVals);
        const maxY = Math.max(...yVals);
        const width = maxX - minX;
        const height = maxY - minY;

        const color = materials.find(m => m.id === room.material)?.color || '#d5b78e';
        const plane = new THREE.Mesh(
          new THREE.BoxGeometry(width, 2, height),
          new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.08 })
        );
        plane.position.set((minX + maxX) / 2, 0, (minY + maxY) / 2);
        plane.rotation.x = 0;
        scene.add(plane);

        const wallMat = new THREE.MeshStandardMaterial({ color: '#f8f4ee', roughness: 0.8 });
        state.walls.forEach(w => {
          const dx = w.x2 - w.x1, dy = w.y2 - w.y1;
          const len = Math.hypot(dx, dy);
          const wallMesh = new THREE.Mesh(new THREE.BoxGeometry(len, 24, 6), wallMat);
          wallMesh.position.set((w.x1 + w.x2) / 2, 12, (w.y1 + w.y2) / 2);
          const angle = Math.atan2(dy, dx);
          wallMesh.rotation.y = -angle;
          wallMesh.rotation.x = 0;
          scene.add(wallMesh);
        });
      });

      state.furniture.forEach((furniture) => {
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(furniture.w, 30, furniture.h),
          new THREE.MeshStandardMaterial({ color: furniture.color, roughness: 0.8 })
        );
        mesh.position.set(furniture.x + furniture.w / 2, 15, furniture.y + furniture.h / 2);
        mesh.rotation.y = -((furniture.angle || 0) * Math.PI / 180);
        scene.add(mesh);
      });

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.enablePan = true;
      controls.enableZoom = true;
      controls.target.set(480, 0, 380);
      controls.update();

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }

    function renderStats() {
      const totalArea = state.rooms.reduce((sum, room) => sum + polygonArea(room.polygon), 0);
      const usedArea = state.furniture.reduce((sum, item) => sum + item.w * item.h, 0);
      const cost = state.rooms.reduce((sum, room) => {
        const mat = materials.find(m => m.id === room.material) || materials[0];
        return sum + (polygonArea(room.polygon) / 10000) * mat.price * 1.05;
      }, 0);

      areaTotal.textContent = `${Math.round(totalArea / 10000)}㎡`;
      areaUsed.textContent = `${Math.round(usedArea / 10000)}㎡`;
      furnitureCount.textContent = `${state.furniture.length}`;
      budgetTotal.textContent = `¥${Math.round(cost)}`;
    }

    function render() {
      renderPlan();
      renderRoomList();
      syncRoomEditor();
      renderStats();

      const selectedFurniture = state.selectedId ? furnitureById(state.selectedId) : null;
      fabName.textContent = selectedFurniture ? selectedFurniture.name : (state.selectedRoom || '房间');
      fab.classList.toggle('show', !!selectedFurniture);

      const toolLabels = {
        select: '选择模式',
        measure: '测量模式',
        demolish: '拆改模式'
      };
      showHud(toolLabels[state.tool] || '选择模式');

      document.body.classList.toggle('view-3d', state.view === '3d');
      document.querySelectorAll('[data-tool]').forEach(btn => {
        btn.classList.toggle('on', btn.dataset.tool === state.tool);
      });
      document.querySelectorAll('[data-view]').forEach(btn => {
        btn.classList.toggle('on', btn.dataset.view === state.view);
      });
      document.querySelectorAll('[data-lang]').forEach(btn => {
        btn.classList.toggle('on', btn.dataset.lang === 'zh');
      });

      if (state.view === '3d') {
        render3D();
      }
    }

    function applyRoomChanges() {
      const room = roomById(state.selectedRoom);
      if (!room) return;
      room.name = roomNameInput.value.trim() || room.name;
      if (state.rooms.some(r => r.id !== room.id && r.name === room.name)) {
        room.name = `${room.name} 1`;
      }
      state.selectedRoom = room.name;
      roomListEl.innerHTML = '';
      render();
      savePlan();
      showToast('房间已更新');
    }

    function exportPlan() {
      const payload = { rooms: state.rooms, furniture: state.furniture, walls: state.walls };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'plan.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('方案已导出');
    }

    function importPlan() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(String(ev.target.result || '{}'));
            if (data.rooms) state.rooms = data.rooms;
            if (data.furniture) state.furniture = data.furniture;
            if (data.walls) state.walls = data.walls;
            state.selectedRoom = state.rooms[0].id;
            savePlan();
            render();
            showToast('方案已导入');
          } catch (err) {
            showToast('JSON 无效');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function addKeyBindings() {
      document.addEventListener('keydown', (evt) => {
        const key = evt.key.toLowerCase();
        if (evt.key === 'Delete' || evt.key === 'Backspace') {
          if (state.selectedId) {
            state.furniture = state.furniture.filter(f => f.id !== state.selectedId);
            state.selectedId = null;
            render();
            savePlan();
          }
        }
        if ((evt.ctrlKey || evt.metaKey) && key === 'd') {
          evt.preventDefault();
          if (!state.selectedId) return;
          const f = furnitureById(state.selectedId);
          if (!f) return;
          state.furniture.push({ ...f, id: randomId('copy'), x: f.x + 22, y: f.y + 22 });
          state.selectedId = state.furniture[state.furniture.length - 1].id;
          render();
          savePlan();
        }
        if ((evt.ctrlKey || evt.metaKey) && key === 'z') {
          showToast('撤销已恢复');
        }
        if (key === 'v') state.tool = 'select';
        if (key === 'm') state.tool = 'measure';
        if (key === 'x') state.tool = 'demolish';
        if (key === 'r') {
          if (!state.selectedId) return;
          const f = furnitureById(state.selectedId);
          if (!f) return;
          f.angle = (f.angle || 0) + 90;
          render();
          savePlan();
        }
        render();
      });
    }

    function bindControls() {
      document.querySelectorAll('[data-tool]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.tool = btn.dataset.tool;
          render();
        });
      });

      document.querySelectorAll('[data-view]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.view = btn.dataset.view;
          render();
        });
      });

      document.querySelectorAll('[data-lang]').forEach(btn => {
        btn.addEventListener('click', () => {
          // language toggle kept for UI compatibility, no translated strings required
          btn.classList.add('on');
          document.querySelectorAll('[data-lang]').forEach(el => {
            if (el !== btn) el.classList.remove('on');
          });
        });
      });

      document.getElementById('newPlanBtn').addEventListener('click', () => {
        state.furniture = [];
        state.walls = [];
        state.selectedId = null;
        savePlan();
        render();
      });

      document.getElementById('deleteBtn').addEventListener('click', () => {
        if (!state.selectedId) return;
        state.furniture = state.furniture.filter(f => f.id !== state.selectedId);
        state.selectedId = null;
        savePlan();
        render();
      });

      document.getElementById('copyBtn').addEventListener('click', () => {
        if (!state.selectedId) return;
        const f = furnitureById(state.selectedId);
        if (!f) return;
        const copy = { ...f, id: randomId('copy'), x: f.x + 20, y: f.y + 20 };
        state.furniture.push(copy);
        state.selectedId = copy.id;
        render();
        savePlan();
      });

      document.getElementById('rotateBtn').addEventListener('click', () => {
        if (!state.selectedId) return;
        const f = furnitureById(state.selectedId);
        if (!f) return;
        f.angle = (f.angle || 0) + 90;
        savePlan();
        render();
      });

      document.getElementById('applyRoomBtn').addEventListener('click', applyRoomChanges);
      document.getElementById('exportBtn').addEventListener('click', exportPlan);
      document.getElementById('importBtn').addEventListener('click', importPlan);
    }

    function init() {
      loadPlan();
      renderLibrary();
      bindControls();
      addKeyBindings();
      state.selectedRoom = state.rooms[0].id;
      render();
      savePlan();
    }

    init();
  </script>
</body>
</html>
