<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>户型装修设计 - 参考蓝图校准</title>
  <style>
    :root {
      --bg: #f3efe7;
      --panel: #fffdf9;
      --ink: #2b2824;
      --muted: #7e756a;
      --line: #e7dfd0;
      --accent: #b5653a;
      --accent-soft: #f4e3d8;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 0 rgba(43,40,36,.04);
    }

    .brand {
      font-weight: 700;
      letter-spacing: .5px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
      transition: .15s ease;
    }

    .btn:hover {
      border-color: #d5c9b8;
      background: #faf7f2;
    }

    .btn.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .btn.primary:hover {
      background: #a65d36;
    }

    .status {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    main {
      position: relative;
      overflow: hidden;
      background: #efe9df;
    }

    #plan {
      width: 100%;
      height: 100%;
      display: block;
      background: #f8f3ee;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(0,0,0,0.02));
      pointer-events: none;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--panel);
      border-top: 1px solid var(--line);
      padding: 6px 14px;
      font-size: 12px;
      color: var(--muted);
    }

    #meta {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">户型装修设计 · 参考蓝图校准</div>
    <div class="toolbar">
      <button class="btn primary" id="toggleRef" type="button">显示参考图</button>
      <button class="btn" id="zoom1" type="button">1:60</button>
      <button class="btn" id="zoom2" type="button">1:100</button>
      <span class="status" id="status">已按户型图.jpg 作为基准</span>
    </div>
  </header>

  <main>
    <svg id="plan" viewBox="0 0 9370 8570" xmlns="http://www.w3.org/2000/svg" aria-label="户型平面图参照"></svg>
    <div class="overlay" aria-hidden="true"></div>
  </main>

  <footer>
    <div>参考来源： <strong>户型图.jpg</strong></div>
    <div id="meta">比例：1:60 · 尺寸单位：mm</div>
  </footer>

  <script>
    const svg = document.getElementById('plan');
    const statusEl = document.getElementById('status');
    const metaEl = document.getElementById('meta');
    const toggleRefBtn = document.getElementById('toggleRef');

    const rooms = [
      { id: 'bath', name: '卫生间', poly: [[240,240],[600,240],[600,970],[2700,970],[2700,2440],[240,2440]], fill: '#dfe8e4' },
      { id: 'bedA', name: '卧室A', poly: [[240,2250],[3150,2250],[3150,6470],[240,6470]], fill: '#d7c6ab' },
      { id: 'living', name: '客厅', poly: [[2250,240],[6330,240],[6330,1850],[5230,1850],[5230,6580],[840,6580],[840,6470],[2250,6470]], fill: '#dfe6ed' },
      { id: 'kitchen', name: '厨房', poly: [[6450,240],[8860,240],[8860,1850],[6450,1850]], fill: '#e2e2df' },
      { id: 'study', name: '书房', poly: [[6450,1850],[9140,1850],[9140,3820],[6450,3820]], fill: '#d5c7a4' },
      { id: 'bedB', name: '卧室B', poly: [[6450,3950],[9140,3950],[9140,7390],[8860,7390],[8860,8460],[7010,8460],[7010,7390],[6450,7390]], fill: '#d5d9c9' },
      { id: 'balcony', name: '阳台', poly: [[3940,6470],[6960,6470],[6960,7390],[3940,7390]], fill: '#dfe5df' }
    ];

    const walls = [
      [600,0,1750,240], [3600,0,6330,240], [410,0,600,240],
      [0,970,240,1850], [410,970,600,1850], [0,1850,240,6490],
      [0,6470,560,6580], [240,6470,560,6580], [560,6470,840,6580],
      [3700,6470,3940,7390], [6960,6470,7200,7390], [3700,7150,7200,7390],
      [6330,0,6740,290], [6330,290,9140,540], [8860,290,9140,540],
      [9140,0,9370,3950], [9140,3950,9370,7390], [6330,7390,9370,7460],
      [6740,7390,7010,7600], [6740,7600,7010,8570], [8590,7390,8860,7600],
      [8590,7600,8860,8570], [7010,8460,8590,8570],
      [2700,240,2840,1720], [2070,1720,2840,1840], [240,2440,2070,2560],
      [240,2150,2480,2250], [3150,2440,3150,6470], [3150,970,3280,2440],
      [6330,240,8860,360], [6330,540,6450,1720], [6330,1720,8860,1850],
      [6330,3820,8860,3950], [6330,1850,6450,3820], [6330,3950,6450,7390]
    ];

    let showRef = true;
    let scale = 1;

    function polyToString(poly) {
      return poly.map(([x, y]) => `${x},${y}`).join(' ');
    }

    function renderBackground() {
      const ref = showRef ? `<image href="./户型图.jpg" x="0" y="0" width="9370" height="8570" opacity="0.32" />` : '';
      const g = `
        <g>
          ${ref}
          <g opacity="0.88">
            ${rooms.map(room => `<polygon points="${polyToString(room.poly)}" fill="${room.fill}" stroke="#b5653a" stroke-width="12" stroke-opacity="0.38" vector-effect="non-scaling-stroke" />`).join('')}
            ${walls.map(([x0,y0,x1,y1]) => `<rect x="${x0}" y="${y0}" width="${Math.max(1, x1 - x0)}" height="${Math.max(1, y1 - y0)}" fill="none" stroke="#2b2824" stroke-width="12" opacity="0.45" vector-effect="non-scaling-stroke" />`).join('')}
          </g>
          <g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#2b2824" font-size="220" font-weight="600" text-anchor="middle">
            ${rooms.map((room, idx) => {
              const [x, y] = room.poly[0];
              const cx = room.poly.reduce((sum, [px]) => sum + px, 0) / room.poly.length;
              const cy = room.poly.reduce((sum, [, py]) => sum + py, 0) / room.poly.length;
              return `<text x="${cx}" y="${cy}" fill="#2b2824" opacity="0.9">${room.name}</text>`;
            }).join('')}
          </g>
        </g>
      `;
      svg.innerHTML = g;
    }

    function updateScaleLabel() {
      const label = scale === 1 ? '1:60' : '1:100';
      metaEl.textContent = `比例：${label} · 尺寸单位：mm`;
      statusEl.textContent = showRef ? '已按户型图.jpg 作为基准' : '已关闭参考图，仅显示修正轮廓';
    }

    document.getElementById('toggleRef').addEventListener('click', () => {
      showRef = !showRef;
      toggleRefBtn.textContent = showRef ? '隐藏参考图' : '显示参考图';
      renderBackground();
      updateScaleLabel();
    });

    document.getElementById('zoom1').addEventListener('click', () => {
      scale = 1;
      svg.setAttribute('viewBox', '0 0 9370 8570');
      updateScaleLabel();
    });

    document.getElementById('zoom2').addEventListener('click', () => {
      scale = 2;
      svg.setAttribute('viewBox', '0 0 9370 8570');
      updateScaleLabel();
    });

    renderBackground();
    updateScaleLabel();
  </script>
</body>
</html>
